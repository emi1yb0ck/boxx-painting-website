<g fill="#e05a2b"><ellipse cx="270" cy="556" rx="14" ry="9"/><ellipse cx="320" cy="552" rx="12" ry="8"/><ellipse cx="600" cy="556" rx="10" ry="7"/></g>
<g fill="#f2b632"><ellipse cx="295" cy="550" rx="10" ry="7"/><ellipse cx="345" cy="560" rx="9" ry="6"/><ellipse cx="580" cy="552" rx="8" ry="6"/></g></g>
<!-- palms -->
