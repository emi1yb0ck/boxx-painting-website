  <pattern id="tile" width="22" height="16" patternUnits="userSpaceOnUse"><rect width="22" height="16" fill="#c9653f"/><path d="M0 16 Q11 4 22 16" fill="#e07c52"/><path d="M0 16 Q11 4 22 16" fill="none" stroke="#9e4a2c" stroke-width="1.5"/></pattern>
  <pattern id="pavers" width="30" height="16" patternUnits="userSpaceOnUse"><rect width="30" height="16" fill="#c9a37a"/><path d="M0 0H30M0 8H30M15 0V8M0 8V16M30 8V16" stroke="#a9845c" stroke-width="1.5"/></pattern>
  <symbol id="palm" viewBox="0 0 200 400"><path d="M100 400 C96 300 92 200 104 90" stroke="#8a6b4a" stroke-width="12" fill="none"/><path d="M100 400 C96 300 92 200 104 90" stroke="#6e5238" stroke-width="12" stroke-dasharray="3 14" fill="none"/><g fill="#2f7d3a"><path d="M104 90 C70 60 30 70 0 110 C40 85 70 85 104 95Z"/><path d="M104 90 C140 55 180 65 200 110 C165 85 135 85 104 95Z"/><path d="M104 90 C90 40 60 20 30 25 C65 40 85 60 102 92Z"/><path d="M104 90 C120 40 150 18 185 22 C150 40 125 62 106 92Z"/><path d="M104 90 C80 100 55 130 50 170 C70 135 85 115 106 96Z"/><path d="M104 90 C130 100 150 130 158 170 C140 135 125 115 102 96Z"/><path d="M104 90 C104 50 110 20 118 0 C112 35 110 60 106 92Z" fill="#3c9447"/></g><circle cx="100" cy="98" r="7" fill="#a0782f"/><circle cx="110" cy="100" r="6" fill="#a0782f"/></symbol>
</defs>
<rect width="1200" height="700" fill="url(#sky)"/>
<g fill="#fff" opacity=".9"><ellipse cx="220" cy="110" rx="90" ry="26"/><ellipse cx="290" cy="95" rx="60" ry="30"/><ellipse cx="900" cy="80" rx="110" ry="28"/><ellipse cx="980" cy="70" rx="60" ry="26"/></g>
<rect y="560" width="1200" height="140" fill="#5f9e45"/>
